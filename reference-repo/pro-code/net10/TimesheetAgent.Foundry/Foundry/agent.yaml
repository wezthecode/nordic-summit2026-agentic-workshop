# Microsoft Foundry deployment manifest — TODO(rehearsal-week)
#
# This file gets locked in during rehearsal week (14 Sept 2026) once the
# `az foundry agent deploy` CLI surface is stable. The shape below is the
# expected manifest based on current preview docs — treat as a sketch.
#
# Once finalised, deployment is:
#   az login
#   az foundry agent deploy --file agent.yaml
#
# The compiled assembly from `dotnet publish` is the artefact being uploaded.

apiVersion: foundry.microsoft.com/v1alpha1
kind: Agent
metadata:
  name: timesheet-orchestrator
  description: Workshop reference — multi-agent timesheet logger
spec:
  runtime:
    type: dotnet
    framework: net10.0
    entryAssembly: TimesheetAgent.Foundry.dll
  agents:
    - name: orchestrator
      type: orchestrator
      promptSource:
        kind: file
        path: ../../workshop/shared-assets/prompts/orchestrator.system.md
      children:
        - calendar-child
        - time-entry-child
    - name: calendar-child
      promptSource:
        kind: file
        path: ../../workshop/shared-assets/prompts/calendar-child.system.md
      mcps:
        - name: work-iq-calendar
          firstParty: true
    - name: time-entry-child
      promptSource:
        kind: file
        path: ../../workshop/shared-assets/prompts/time-entry-child.system.md
        substitutions:
          SOURCE_VALUE: "3"   # 3 = Foundry agent in cre_source choice column
      mcps:
        - name: dataverse
          firstParty: true
          tables:
            - cre_timeentry
            - cre_project
  identity:
    type: managed
  # TODO(rehearsal-week): observability block — Application Insights connection,
  # trace sampling rate, PII redaction rules.
